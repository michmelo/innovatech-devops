# Taller: tres servicios (un proceso por contenedor). La red por defecto de Compose
# permite que "frontend" resuelva los nombres java-backend y python-backend.
#
# Nombre del proyecto: define el prefijo de contenedores, red e imágenes (antes salía
# de la carpeta, p. ej. dockerfile-devops-*). Personalízalo (minúsculas, números, guiones).

name: taller-docker

services:
  java-backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    container_name: java-backend
    ports:
      - "8080:8080"
    volumes:
      - java-data:/app/data
    networks:
      - app-network
    restart: unless-stopped

  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: python-backend
    ports:
      - "5001:5000"
    volumes:
      - python-data:/app/data
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./node-frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "3000:3000"
    environment:
      JAVA_API_URL: http://java-backend:8080
      PYTHON_API_URL: http://python-backend:5000
    depends_on:
      - java-backend
      - python-backend
    networks:
      - app-network
    restart: unless-stopped

# Named volumes — Docker administra dónde se guardan físicamente.
# Elegimos named volume sobre bind mount porque:
# - Es portable: funciona igual en cualquier máquina o EC2
# - Es más seguro: no expone rutas del sistema host
# - Ideal para datos críticos que deben sobrevivir reinicios
volumes:
  java-data:
  python-data:

# Red interna — los servicios se hablan por nombre
# sin necesidad de conocer IPs
networks:
  app-network:
    driver: bridge
