name: CI/CD Pipeline

# Se activa solo cuando hay push en la rama deploy
on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Inicia sesión en Docker Hub usando los secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Construye y publica imagen del java-backend
      - name: Build and push java-backend
        uses: docker/build-push-action@v5
        with:
          context: ./java-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:latest

      # 4. Construye y publica imagen del python-backend
      - name: Build and push python-backend
        uses: docker/build-push-action@v5
        with:
          context: ./python-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-backend:latest

      # 5. Construye y publica imagen del frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./node-frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      # 6. Prepara la clave SSH para conectarse a las EC2
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/innovatech-key.pem
          chmod 400 ~/.ssh/innovatech-key.pem
          ssh-keyscan -H ${{ secrets.EC2_FRONTEND_IP }} >> ~/.ssh/known_hosts

      # 7. Despliega en EC2 Frontend
      - name: Deploy to EC2 Frontend
        run: |
          ssh -i ~/.ssh/innovatech-key.pem ec2-user@${{ secrets.EC2_FRONTEND_IP }} "
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest &&
            docker stop frontend-app 2>/dev/null || true &&
            docker rm frontend-app 2>/dev/null || true &&
            docker run -d \
              --name frontend-app \
              --restart unless-stopped \
              -p 3000:3000 \
              -e JAVA_API_URL=http://${{ secrets.EC2_BACKEND_IP }}:8080 \
              -e PYTHON_API_URL=http://${{ secrets.EC2_BACKEND_IP }}:5001 \
              ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          "

      # 8. Despliega en EC2 Backend (a través del frontend como puente)
      - name: Deploy to EC2 Backend
        run: |
          ssh -i ~/.ssh/innovatech-key.pem -o ProxyJump=ec2-user@${{ secrets.EC2_FRONTEND_IP }} ec2-user@${{ secrets.EC2_BACKEND_IP }} "
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:latest &&
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python-backend:latest &&
            docker stop java-backend 2>/dev/null || true &&
            docker stop python-backend 2>/dev/null || true &&
            docker rm java-backend 2>/dev/null || true &&
            docker rm python-backend 2>/dev/null || true &&
            docker run -d \
              --name java-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              -v java-data:/app/data \
              ${{ secrets.DOCKERHUB_USERNAME }}/java-backend:latest &&
            docker run -d \
              --name python-backend \
              --restart unless-stopped \
              -p 5001:5000 \
              -v python-data:/app/data \
              ${{ secrets.DOCKERHUB_USERNAME }}/python-backend:latest
          "